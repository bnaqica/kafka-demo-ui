# Serves the built UI and proxies /api/* to the services, mirroring vite.config.js.
# host.docker.internal reaches services running on your machine (./gradlew bootRun).
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/customers { proxy_pass http://host.docker.internal:8081; }
    location /api/emails    { proxy_pass http://host.docker.internal:8082; }
    location /api/analytics { proxy_pass http://host.docker.internal:8083; }

    location / {
        try_files $uri /index.html;
    }
}
